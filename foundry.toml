[profile.default]
src = "contracts"
test = "test"
out = "forge-out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
ffi = false
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./.env" }]

[rpc_endpoints]
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

# Do not compile the Remix-era Aave mock driver as a Forge test.
[profile.default.fmt]
line_length = 120
